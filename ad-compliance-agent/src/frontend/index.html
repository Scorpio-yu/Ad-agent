<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广告合规审核 Agent</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>广告合规审核 Agent</h1>
            <span class="header-badge">RAG + LLM</span>
        </header>

        <main class="chat-area" id="chatArea">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">&#x1F50D;</div>
                <h2>广告合规智能审核</h2>
                <p>输入广告文案，系统将自动检索法规并生成审核报告</p>
                <div class="examples">
                    <span class="example-tag" data-text="全网最低价，绝对正品，假一赔十">全网最低价...</span>
                    <span class="example-tag" data-text="某某面膜，三天美白，效果最好">某某面膜...</span>
                    <span class="example-tag" data-text="品质优良，价格实惠，欢迎选购">品质优良...</span>
                </div>
            </div>
        </main>

        <footer class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="adInput"
                    placeholder="请输入广告文案..."
                    rows="1"
                    maxlength="5000"
                ></textarea>
                <button id="sendBtn" title="发送 (Enter)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                    </svg>
                </button>
            </div>
            <span class="char-count"><span id="charCount">0</span>/5000</span>
        </footer>
    </div>

    <template id="userMsgTemplate">
        <div class="message user-message">
            <div class="msg-avatar">U</div>
            <div class="msg-content"></div>
        </div>
    </template>

    <template id="resultCardTemplate">
        <div class="message bot-message">
            <div class="msg-avatar">AI</div>
            <div class="msg-content">
                <div class="result-card">
                    <div class="result-status"></div>
                    <div class="result-body"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="loadingTemplate">
        <div class="message bot-message">
            <div class="msg-avatar">AI</div>
            <div class="msg-content">
                <div class="loading-dots"><span></span><span></span><span></span></div>
            </div>
        </div>
    </template>

    <template id="streamingTemplate">
        <div class="message bot-message">
            <div class="msg-avatar">AI</div>
            <div class="msg-content">
                <div class="streaming-box">
                    <div class="streaming-header">正在审核中...</div>
                    <div class="streaming-text" id="streamingText"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="/static/js/app.js"></script>
</body>
</html>
